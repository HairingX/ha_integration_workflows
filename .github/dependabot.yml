# Proposes updates to the pinned actions and test tools as pull requests, which CI then checks
# before anything is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /ha/actions/*
      - /python/actions/*
      - /card/actions/*
      - /common/template
      - /ha/template
      - /python/template
      - /card/template
    schedule:
      interval: weekly
    labels:
      - dependencies
    assignees:
      - HairingX

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    assignees:
      - HairingX
