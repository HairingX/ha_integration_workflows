name: CI

# The tools' tests, pyright strict, and actionlint with shellcheck on every workflow. Also called
# by Publish, on the exact commit it releases.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        required: true
        type: string

permissions:
  contents: read

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Tests, type check and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the test tools
        run: python -m pip install -r requirements-test.txt actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1

      - name: Type check (pyright strict)
        run: pyright

      - name: Test
        run: python -m pytest -q

      - name: Lint the workflows and the callers' templates
        run: |
          actionlint
          actionlint template/.github/workflows/*.yml
