name: GitHub release

# Called by a library's Release workflow once PyPI has the version: publishes the GitHub release
# of the tag, with the distributions the release built. A release candidate keeps the draft
# release; a final release carries the draft's notes and replaces it. Every step can be re-run.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag of the version released.
        required: true
        type: string
      prerelease:
        description: Whether the version is a release candidate, "true" or "false".
        required: true
        type: string
      previous_tag:
        description: The tag the release's notes start from, empty for the first.
        required: false
        type: string
        default: ""
      draft_id:
        description: The draft release a final release replaces, empty without one.
        required: false
        type: string
        default: ""
      draft_body:
        description: The draft release's notes, base64.
        required: false
        type: string
        default: ""

permissions: {}

env:
  COMMON_TOOLS: .workflows/common/tools

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      DRAFT_ID: ${{ inputs.draft_id }}
      DRAFT_BODY: ${{ inputs.draft_body }}
    steps:
      - name: Check out the release tools of this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Before publishing: gh finds a release by its tag among drafts too, so a re-run would
      # otherwise upload to the draft of the same tag. Its notes were captured before.
      - name: Delete the draft the final release replaces
        if: inputs.prerelease == 'false' && inputs.draft_id != ''
        run: |
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --silent 2> "$RUNNER_TEMP/error"; then
            cat "$RUNNER_TEMP/error"
            # Deleted by an earlier attempt of this run.
            grep -q "HTTP 404" "$RUNNER_TEMP/error"
          fi

      - name: Publish the GitHub release with the distributions
        run: |
          # releases/tags/... returns only a published release, never the draft of the same tag.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG is already released; uploading the distributions again."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # gh creates a release as a draft and publishes it once the files are uploaded: an
          # attempt that died in between left a draft of this tag behind.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' > "$RUNNER_TEMP/stray"
          while read -r id; do
            echo "Removing the draft $id of $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" --silent
          done < "$RUNNER_TEMP/stray"
          flags=()
          if [[ "$PRERELEASE" == "false" && -n "$DRAFT_ID" ]]; then
            # A final release carries the draft's notes, as approved before running the release.
            python "$COMMON_TOOLS/release_version.py" final-notes "$PREVIOUS_TAG" "$DRAFT_BODY" \
              "$RUNNER_TEMP/notes.md"
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            # GitHub writes the notes from the pull requests since the previous release.
            flags+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              flags+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" "${flags[@]}"
