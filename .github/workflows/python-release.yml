name: Release

# Called by a library's Release workflow, run from its Actions tab on main once the maintainer has
# approved the draft release and its version. Never publish the draft by hand: the package takes
# its version from the tag, and only this tags a tested commit.
#
# Everything runs in one direction, and nothing leaves the runner until it has been checked:
# work out the version -> test the exact commit -> tag it, build, and check that the built package
# says that version -> push the tag. The caller then publishes to PyPI from its own workflow, as
# trusted publishing takes no reusable workflow, and the GitHub release last. Nothing is pushed to
# main. If publishing fails part-way, "Re-run failed jobs" resumes it.
on:
  workflow_call:
    inputs:
      release:
        description: '"release candidate" or "final release".'
        required: true
        type: string
      version:
        description: >-
          Override, only for a new major version or one worked out wrongly: canonical PEP 440
          without a v, of the kind chosen.
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: The version released.
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: The tag of the version released.
        value: ${{ jobs.prepare.outputs.tag }}
      prerelease:
        description: Whether the version is a release candidate.
        value: ${{ jobs.prepare.outputs.prerelease }}
      previous_tag:
        description: The tag the release's notes start from, empty for the first.
        value: ${{ jobs.prepare.outputs.previous_tag }}
      package:
        description: The distribution's name on PyPI.
        value: ${{ jobs.prepare.outputs.package }}
      draft_id:
        description: The draft release a final release replaces, empty without one.
        value: ${{ jobs.prepare.outputs.draft_id }}
      draft_body:
        description: The draft release's notes, base64.
        value: ${{ jobs.prepare.outputs.draft_body }}

permissions: {}

env:
  COMMON_TOOLS: .workflows/common/tools
  PYTHON_TOOLS: .workflows/python/tools

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only to those who can push.
      contents: write
      # The pull requests merged since the previous release.
      pull-requests: read
      # Whether Release Drafter has finished with the commit released.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      package: ${{ steps.package.outputs.package }}
      sha: ${{ steps.main.outputs.sha }}
      draft_id: ${{ steps.draft.outputs.draft_id }}
      draft_body: ${{ steps.draft.outputs.draft_body }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to run from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not $GITHUB_REF_NAME."
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check out the release tools of this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Record the commit to release
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Name the package
        id: package
        run: echo "package=$(python "$PYTHON_TOOLS/package.py" name .)" | tee -a "$GITHUB_OUTPUT"

      # Read before the draft: the draft describes the commit only if Release Drafter had already
      # finished with it when the draft was read.
      - name: Check that Release Drafter has finished with the commit
        id: drafter
        env:
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-drafter.yml \
            --branch main --event push --limit 1 --json headSha,status,conclusion \
            --jq '.[0] | "\(.headSha) \(.status) \(.conclusion)"')
          echo "Newest Release Drafter run on main: ${run:-none}"
          if [[ "$run" == "$SHA completed success" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the draft release
        id: draft
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft) | @json' > "$RUNNER_TEMP/drafts"
          python "$COMMON_TOOLS/release_version.py" draft "$RUNNER_TEMP/drafts" >> "$GITHUB_OUTPUT"
          grep '^draft_tag=' "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          OVERRIDE: ${{ inputs.version }}
          DRAFT_TAG: ${{ steps.draft.outputs.draft_tag }}
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
            > "$RUNNER_TEMP/tags"
          # Every version PyPI has ever taken, yanked ones too: it never takes one twice.
          : > "$RUNNER_TEMP/published"
          status=$(curl -sS -o "$RUNNER_TEMP/pypi.json" -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/json")
          case "$status" in
            200) jq -r '.releases | keys[]' "$RUNNER_TEMP/pypi.json" > "$RUNNER_TEMP/published" ;;
            404) echo "$PACKAGE is not on PyPI yet" ;;
            *) echo "::error::PyPI answered $status for $PACKAGE"; exit 1 ;;
          esac
          python "$COMMON_TOOLS/release_version.py" next "$RELEASE" "$DRAFT_TAG" "$OVERRIDE" \
            "$RUNNER_TEMP/tags" "$RUNNER_TEMP/published" | tee -a "$GITHUB_OUTPUT"

      - name: Refuse a draft that does not describe the commit
        if: steps.version.outputs.uses_draft == 'true'
        env:
          SHA: ${{ steps.main.outputs.sha }}
          READY: ${{ steps.drafter.outputs.ready }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$READY" != "true" || "$main" != "$SHA" ]]; then
            echo "::error::The draft release is not yet up to date with main. Wait for the Release Drafter run on main to finish, then run the release again."
            exit 1
          fi

      - name: Refuse a release without changes
        if: steps.version.outputs.previous_tag != ''
        env:
          SINCE: ${{ steps.version.outputs.previous_tag }}
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$SINCE...$SHA" \
            --jq '.commits[].sha' > "$RUNNER_TEMP/commits"
          : > "$RUNNER_TEMP/merged"
          while read -r sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null) | .number' >> "$RUNNER_TEMP/merged"
          done < "$RUNNER_TEMP/commits"
          python "$COMMON_TOOLS/release_version.py" changes "$SINCE" "$RUNNER_TEMP/merged"

  test:
    name: Python ${{ matrix.python-version }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the commit to release, with every tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          # setuptools-scm works the version out from the tags.
          fetch-depth: 0

      - name: Check out the release tools of this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Tests and type check
        uses: ./.workflows/python/actions/tests
        with:
          python-version: ${{ matrix.python-version }}
          branch: main
          template-check: "false"

  build:
    name: Tag, build and push the tag
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out the tested commit, with every tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # setuptools-scm works the version out from the tags.
          fetch-depth: 0

      - name: Check out the release tools of this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the build tools
        run: python -m pip install build==1.6.1

      - name: Tag the tested commit
        id: tag
        run: |
          # A re-run finds the tag it pushed before; the tag is annotated, so compare its commit.
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            tagged=$(git rev-parse "$TAG^{commit}")
            if [[ "$tagged" != "$SHA" ]]; then
              echo "::error::$TAG already tags $tagged, not the tested commit $SHA."
              exit 1
            fi
            echo "$TAG already tags $SHA."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$SHA"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # setuptools-scm would read the tools' checkout as part of the package's tree.
      - name: Build
        run: |
          rm -rf .workflows
          python -m build

      - name: Check the built package says this version
        run: |
          shopt -s nullglob
          wheels=(dist/*-"$VERSION"-*.whl)
          sdists=(dist/*-"$VERSION".tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected one wheel and one sdist for $VERSION. dist/ holds:"
            ls -1 dist/
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/pip" install -q "${wheels[0]}"
          "$RUNNER_TEMP/check/bin/python" - <<'PY'
          import importlib.metadata, os, sys, zipfile, glob
          version = os.environ["VERSION"]
          wheel = glob.glob(f"dist/*-{version}-*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              name = next(line.split(":", 1)[1].strip() for line in archive.read(metadata).decode().splitlines() if line.startswith("Name:"))
          found = importlib.metadata.version(name)
          if found != version:
              sys.exit(f"::error::the built package's metadata says {found}, not {version}")
          print(f"{name} {version}: the metadata agrees")
          PY

      - name: Push the tag
        if: steps.tag.outputs.pushed == 'false'
        run: git push origin "refs/tags/$TAG"

      - name: Keep the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          overwrite: true
