name: HACS
description: >-
  HACS's validation of the card's repository, at the commit given or the event's. HACS installs a
  card from the newest final release's assets, so it can find one only from the first final
  release on: before it, the validation is skipped with a notice. Needs no checkout.

inputs:
  ref:
    description: The commit to validate; empty validates the event's.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Look for a final release
      id: released
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # releases/latest returns the newest final release: never a draft or a pre-release.
        if gh api "repos/$GITHUB_REPOSITORY/releases/latest" --silent 2> "$RUNNER_TEMP/error"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        elif grep -q "HTTP 404" "$RUNNER_TEMP/error"; then
          echo "::notice::No final release yet, so HACS would find no card to install; it validates the repository from the first final release on."
          echo "found=false" >> "$GITHUB_OUTPUT"
        else
          cat "$RUNNER_TEMP/error"
          exit 1
        fi

    # HACS validates through the GitHub API, at the event's ref unless told otherwise; an empty
    # REPOSITORY_REF would name no ref at all.
    - name: Validate the event's commit
      if: steps.released.outputs.found == 'true' && inputs.ref == ''
      uses: hacs/action@main
      with:
        category: plugin

    - name: Validate the commit given
      if: steps.released.outputs.found == 'true' && inputs.ref != ''
      uses: hacs/action@main
      env:
        REPOSITORY_REF: ${{ inputs.ref }}
      with:
        category: plugin
