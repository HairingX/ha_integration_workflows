name: Validate

# HACS's check of a repository it can install from. It takes its rules from its newest version,
# so it also runs daily: a new rule turns a build red before a user meets it.
#
# The workflows and the tools are shared by every card of the owner, from HairingX/workflows;
# this file is a copy of its template and is checked to stay so.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        uses: HairingX/workflows/card/actions/hacs@v2
