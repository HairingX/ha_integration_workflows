# Not a package: the tools run as scripts on the runners. This file holds the settings of the
# tools the repository is checked with.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["common/tools", "ha/tools", "python/tools"]

[tool.pyright]
# The standard belongs to the repository, not to a personal editor setting: an IDE and a CI run
# must agree on what counts as an error.
include = ["common", "ha", "python", "tests"]
extraPaths = ["common/tools", "ha/tools", "python/tools"]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
