name: Tests and type check
description: >-
  Installs the package and what requirements-test.txt pins - on a development branch with the
  libraries' branch of the same name over their release - then runs pyright strict, the tests
  with full coverage, the repository's contract and the template check. The repository must
  already be checked out, with its tags.

inputs:
  python-version:
    description: The Python to test on.
    required: true
  branch:
    description: >-
      The branch the commit is on. Libraries developed alongside the package are taken from
      their branch of this name, where they have one; empty or main takes their release.
    required: false
    default: ""
  template-check:
    description: >-
      Whether to check that the shared files agree with the template. Release leaves it out: a
      change to the template must not stop a release before every repository is synced, and
      pull requests check it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the package, the test tools and the libraries
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        OWNER: ${{ github.repository_owner }}
      run: |
        common="$GITHUB_ACTION_PATH/../../../common/tools"
        python -m pip install packaging==26.3
        python -m pip install . -r requirements-test.txt
        if [[ -n "$BRANCH" && "$BRANCH" != "main" ]]; then
          python "$common/libraries.py" branch . "$OWNER" "$BRANCH" > "$RUNNER_TEMP/libraries"
          mapfile -t libraries < "$RUNNER_TEMP/libraries"
          if (( ${#libraries[@]} )); then
            printf 'Library from branch %s: %s\n' "$BRANCH" "${libraries[@]}"
            python -m pip install "${libraries[@]}"
          fi
        fi

    - name: Type check (pyright strict)
      shell: bash
      run: pyright

    # Live tests need a real device; they skip themselves without one, and are excluded here.
    # Every line of the package is covered, and stays so.
    - name: Test
      shell: bash
      run: |
        package=$(python "$GITHUB_ACTION_PATH/../../tools/package.py" import .)
        coverage=$(python "$GITHUB_ACTION_PATH/../../../common/tools/settings.py" coverage .)
        python -m pytest -m "not live" -q -o log_cli=false \
          --cov="$package" --cov-report=term-missing --cov-fail-under="$coverage"

    - name: Check the repository's contract
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/library_contract.py" .

    - name: Check that the shared files agree with the template
      if: inputs.template-check == 'true'
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../../common/tools/template.py" check python .
